name: CI calidad de datos

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas del código (pytest)
        run: python -m pytest -v

      - name: Validar datos de ventas (bloquea la carga si falla)
        run: python run_validacion.py data/ventas.csv
